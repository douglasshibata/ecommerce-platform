name: GitOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'ecommerce-platform/apps/**'
  pull_request:
    branches:
      - main
    paths:
      - 'ecommerce-platform/apps/**'

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test, and Tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Test Service
        run: |
          cd ecommerce-platform/apps/${{ matrix.service }}
          mvn clean test package -DskipTests=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-platform/apps/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest

  update-gitops-manifests:
    name: Sync GitOps Tags
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Order Service Image Tag
        run: |
          cd ecommerce-platform/apps/order-service/k8s
          kustomize edit set image your-registry/order-service=ghcr.io/${{ github.repository_owner }}/order-service:${{ github.sha }}

      - name: Update Payment Service Image Tag
        run: |
          cd ecommerce-platform/apps/payment-service/k8s
          kustomize edit set image your-registry/payment-service=ghcr.io/${{ github.repository_owner }}/payment-service:${{ github.sha }}

      - name: Commit and Push Manifest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ecommerce-platform/apps/order-service/k8s/kustomization.yaml
          git add ecommerce-platform/apps/payment-service/k8s/kustomization.yaml
          git commit -m "chore(gitops): update image tags to ${{ github.sha }} [skip ci]"
          git push
